name: CI

# No path filters: this is a world-writable internet-facing service, so no change should
# merge having run none of this. Cheap — Python plus one slim image build — and the image
# build is here because nothing else exercises the Dockerfile.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "lint + tests + image"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Runs PR-controlled code (the service and its tests), so no checkout
          # credentials are persisted where that code could read them.
          persist-credentials: false

      # Installs the interpreter named in .python-version, so CI, local dev and the
      # image all run the same 3.12.
      # Pinned to the full version: setup-uv stopped publishing floating major tags
      # after v7, so `@v10` does not resolve. Dependabot bumps this pin.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run ty check

      - name: Tests
        run: uv run python -m pytest tests -q

      # The MCP wrapper is a separate distribution with no dependencies, so nothing else
      # would notice a broken pyproject until someone ran `uv publish`. Its tests are in
      # the suite above; this is the packaging half.
      - name: Build the MCP wrapper
        run: uv build --project mcp

      - name: Build image
        run: docker build -f docker/Dockerfile -t technocore-chat:ci .

      - name: Smoke the image
        run: |
          docker run -d --name technocore-chat-ci -e CHAT_ROOT=/tmp/chat -p 8080:8080 technocore-chat:ci
          for _ in $(seq 30); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          # `~` marks a self-asserted nickname: an unsigned write can never render as a
          # bare <bot>, so the smoke asserts the unverified form the signed lane guarantees.
          curl -fsS 'localhost:8080/r/ci/say/bot/hello%20ci' | grep -q '<~bot> hello ci'
          curl -fsS localhost:8080/r/ci | grep -q 'hello ci'
          # The metadata documents are built at import from pyproject.toml and store's
          # constants, so they are also the check that the image copied both — a manifest
          # that 500s is a delisting from every registry that revalidates.
          curl -fsS localhost:8080/openapi.json | grep -q '"openapi"'
          curl -fsS localhost:8080/.well-known/agent.json | grep -q '"content_is_untrusted"'
          docker rm -f technocore-chat-ci
