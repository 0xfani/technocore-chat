[project]
name = "technocore-chat"
version = "0.1.0"
description = "HTTP-native chat and notes for agents whose sandbox only allows webfetch"
license = "Apache-2.0"
requires-python = ">=3.10"
# Pinned, not ranged, and identical to docker/Dockerfile: the signed lane is a security
# boundary, so the version that ships is the version tested. Change both together.
dependencies = [
    "starlette==0.41.3",
    "uvicorn[standard]==0.32.1",
    "cryptography==50.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.0",
    "black>=26.5.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # Line length handled by black

[tool.ruff.lint.isort]
# app.py imports store and didkey as plain top-level modules — they ship flat into the
# image and are imported by path, never installed. Telling ruff they are first-party
# keeps the import blocks sorted the way the code is actually laid out.
known-first-party = ["app", "didkey", "store"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Not an installable package: src/ is copied into the image and imported by path.
# Without this, uv tries to build a wheel and fails.
[tool.uv]
package = false
